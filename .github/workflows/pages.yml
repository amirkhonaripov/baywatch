# Build this web app and publish it to GitHub Pages on every push to main.
# Settings -> Pages -> Source: "GitHub Actions".
# Optional: Settings -> Secrets and variables -> Actions -> Variables: SEEN_API_BASE = URL of the BayWatch API (default below)
#   (public deployment: https://sanjar--seen-api.modal.run; the API itself lives in the baywatch-core repository).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.SEEN_API_BASE || 'https://sanjar--seen-api.modal.run' }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
